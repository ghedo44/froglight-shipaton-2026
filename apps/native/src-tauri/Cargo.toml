[package]
name = "froglight-native"
version = "0.0.1"
description = "Froglight Tauri host"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
log = "0.4"
froglight-vault-storage = { path = "plugins/froglight-vault-storage" }
froglight-keyboard-inset = { path = "plugins/froglight-keyboard-inset" }
froglight-stylus = { path = "plugins/froglight-stylus" }
froglight-purchases = { path = "plugins/froglight-purchases" }
froglight-file-drop = { path = "plugins/froglight-file-drop" }
froglight-webview-hardening = { path = "plugins/froglight-webview-hardening" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

# Windows-only: enable the WebView2 settings layer of the hardening plugin
# (AreBrowserAcceleratorKeysEnabled / AreDefaultContextMenusEnabled /
# AreDefaultScriptDialogsEnabled). Other platforms get the DOM guard only.
[target.'cfg(target_os = "windows")'.dependencies]
froglight-webview-hardening = { path = "plugins/froglight-webview-hardening", features = ["platform-windows"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "froglight_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
