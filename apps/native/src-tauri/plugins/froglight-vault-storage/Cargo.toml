[package]
name = "froglight-vault-storage"
version = "0.1.0"
description = "FrogLight-owned mobile vault storage for Android SAF and iOS File Providers"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "froglight-vault-storage"

[target.'cfg(target_os = "ios")'.dependencies]
tempfile = "3"

[dependencies]
base64 = "0.22"
log = "0.4"
tauri = { version = "2.10.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
