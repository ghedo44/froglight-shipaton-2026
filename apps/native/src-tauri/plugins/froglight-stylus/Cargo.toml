[package]
name = "froglight-stylus"
version = "0.1.0"
description = "Froglight-owned stylus accessory events for iPadOS, Android, and desktop hosts"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "froglight-stylus"

[dependencies]
tauri = { version = "2.10.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
