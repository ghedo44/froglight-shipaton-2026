[package]
name = "froglight-keyboard-inset"
version = "0.1.0"
description = "Froglight-owned overlay keyboard insets for Android and iOS"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "froglight-keyboard-inset"

[dependencies]
tauri = { version = "2.10.3" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
