packages:
  - 'packages/*'
  - 'apps/*'

autoInstallPeers: true
overrides:
  pdf-lib>tslib: ^2.8.1
allowBuilds:
  # Firebase ships compiled output; its dev/build scripts must never run on
  # install. Auth (slice C) needs neither @firebase/util builds nor
  # protobufjs (Firestore/gRPC only).
  '@firebase/util': false
  esbuild: true
  nx: true
  protobufjs: false
